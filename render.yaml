# Render Blueprint for the RVM Midterm Exam app (Supabase-backed).
#
# IMPORTANT: this project is a Node.js application (server/index.js).
#
# DATA PERSISTENCE (Render Free Plan + Supabase):
# Render's default filesystem is ephemeral, so durable storage is provided by
# Supabase (`SUPABASE_URL` + `SUPABASE_SERVICE_ROLE_KEY`, or `DATABASE_URL`)
# using the tables in `supabase/schema.sql`. This works on Render's Free plan
# with no paid persistent disk required.
#
# Set the secret values in Render Dashboard → Service → Environment:
#   • SUPABASE_URL               https://<project-ref>.supabase.co
#   • SUPABASE_SERVICE_ROLE_KEY  <service_role or sb_secret_... key>
#
# (Alternative: to use a paid Render Starter disk without Supabase instead,
# set `plan: starter`, mount a disk at `/opt/render/project/src/data`, and set
# `EXAM_DATA_DIR=/opt/render/project/src/data` + `EXAM_STORAGE_MODE=persistent`.)

services:
  - type: web
    name: rvam-exam
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
