<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student exam</title><link rel="stylesheet" href="/simple.css"></head><body>
<header><strong>EXAM PORTAL</strong><span class="muted">Student examination</span></header>
<main><section class="card" id="join"><h1>Enter your exam</h1><p class="muted">Ask your teacher for the access code. Your answers are saved as you select them.</p><form id="joinForm"><label for="code">Exam code</label><input id="code" required maxlength="30" autocomplete="off"><label for="name">Full name</label><input id="name" required minlength="2" maxlength="80" autocomplete="name"><label for="number">Student number</label><input id="number" required minlength="2" maxlength="40"><p class="muted" style="margin-top:14px">The timer starts when you select Start exam.</p><button type="submit">Start exam</button></form></section>
<section id="exam" class="card hidden"><div class="row" style="justify-content:space-between"><h1 id="title">Exam</h1><span class="timer" id="timer"></span></div><p id="save" class="notice" role="status" aria-live="polite">Answers are saved automatically.</p><div id="questions"></div><button id="submit" type="button">Submit exam</button></section>
<section id="result" class="card hidden"><h1>Exam submitted</h1><p id="score"></p><p class="muted">You can close this page.</p></section><div id="message" class="notice error hidden" role="alert"></div></main><script type="module" src="/neon-student.js"></script></body></html>
